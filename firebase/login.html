<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StartupOS · 로그인</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#15375e;font:15px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{background:white;border:1px solid #e4e8ef;border-radius:20px;width:min(100%,400px);padding:32px;box-shadow:0 12px 45px #16223508}h1{font-size:27px;letter-spacing:-1px;margin:0 0 8px}.sub{color:#687386;margin:0 0 28px}form{display:grid;gap:12px}label{display:grid;gap:7px;font-size:13px}input{width:100%;font:inherit;padding:12px;border:1px solid #d5dbe5;border-radius:9px}button{cursor:pointer;font:inherit;min-height:44px;border:1px solid #d5dbe5;border-radius:9px;background:white;padding:10px}button.primary{background:#173f73;color:white;border-color:#173f73}button:disabled{opacity:.5;cursor:wait}hr{width:100%;border:0;border-top:1px solid #e9edf2;margin:8px 0}.row{display:flex;gap:8px}.row button{flex:1;font-size:13px}#message{font-size:13px;line-height:1.6;min-height:20px;color:#a12d32;margin-bottom:0}#verify{display:none;width:100%;margin-top:12px}</style></head><body><main><h1>StartupOS</h1><p class="sub">내 앱을 만들고 관리하는 워크스페이스</p><form id="form"><button class="primary" type="button" id="google">Google로 계속</button><hr><label>이메일<input type="email" id="email" autocomplete="email" required></label><label>비밀번호<input type="password" id="password" autocomplete="current-password" required minlength="8"></label><button class="primary">로그인</button><div class="row"><button type="button" id="signup">회원가입</button><button type="button" id="reset">비밀번호 찾기</button></div></form><button id="verify">인증 메일 다시 보내기</button><p id="message" role="status" aria-live="polite"></p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>
'use strict';
firebase.initializeApp(__FIREBASE_CONFIG__);const auth=firebase.auth(),message=document.getElementById('message');let busy=false;
const value=id=>document.getElementById(id).value.trim();
function report(e){message.textContent=({'auth/invalid-credential':'이메일과 비밀번호를 확인해 주세요.','auth/popup-closed-by-user':'로그인 창이 닫혔습니다. 다시 시도해 주세요.','auth/email-already-in-use':'이미 등록된 이메일입니다. 로그인해 주세요.','auth/weak-password':'비밀번호를 8자 이상으로 입력해 주세요.'})[e.code]||e.message||'로그인에 실패했습니다.';}
async function enter(user){
 if(!user)return;if(!user.emailVerified){message.textContent='이메일 인증을 완료한 뒤 다시 로그인해 주세요.';document.getElementById('verify').style.display='block';return;}
 const response=await fetch('/api/auth-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:await user.getIdToken(true)})});const data=await response.json();if(!response.ok)throw Error(data.error||'접근 권한을 확인해 주세요.');
 const next=new URL(location.href).searchParams.get('next'),target=next&&next.startsWith('/')&&!next.startsWith('//')&&!next.includes('\\')?next:'/';location.replace(new URL(target,location.origin).origin===location.origin?target:'/');
}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);message.textContent='확인 중…';try{await fn();}catch(e){report(e);}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
document.getElementById('google').onclick=()=>run(async()=>{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);const result=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());await enter(result.user);});
document.getElementById('form').onsubmit=e=>{e.preventDefault();run(async()=>{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);const result=await auth.signInWithEmailAndPassword(value('email'),document.getElementById('password').value);await enter(result.user);});};
document.getElementById('signup').onclick=()=>run(async()=>{const result=await auth.createUserWithEmailAndPassword(value('email'),document.getElementById('password').value);await result.user.sendEmailVerification();message.textContent='인증 메일을 보냈습니다. 이메일 인증 후 로그인해 주세요.';});
document.getElementById('reset').onclick=()=>run(async()=>{if(!value('email'))throw Error('이메일을 먼저 입력해 주세요.');await auth.sendPasswordResetEmail(value('email'));message.textContent='비밀번호 재설정 메일을 요청했습니다.';});
document.getElementById('verify').onclick=()=>run(async()=>{await auth.currentUser?.sendEmailVerification();message.textContent='인증 메일을 요청했습니다.';});
auth.getRedirectResult().then(result=>{if(result.user)run(()=>enter(result.user));}).catch(report);
auth.onAuthStateChanged(user=>{if(user&&!busy)run(()=>enter(user));});
</script></body></html>
