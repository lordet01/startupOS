/* Unified actionable UI — applies to all Venture Session pages */
.shell,.main,.content,.card,.pageHead,.sessionCard{min-width:0;max-width:100%}
.content{overflow-wrap:anywhere}
.pageHead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}

function compactRuntimeProject(p){
  return {
    _sessionId:p._sessionId,name:p.name,idea:String(p.idea||"").slice(0,700),
    customer:String(p.customer||"").slice(0,400),
    problem:String(p.problem||"").slice(0,600),
    desiredOutcome:String(p.desiredOutcome||"").slice(0,400),
    constraints:String(p.constraints||"").slice(0,450),
    model:p.model,price:p.price,budget:p.budget,_phase:p._phase,
    mvpFeatures:(p.mvpFeatures||[]).slice(0,7),
    serviceFlow:(p.serviceFlow||[]).slice(0,6).map(function(x){return {title:x.title,user_action:x.user_action,system_action:x.system_action}}),
    techStack:(p.techStack||[]).slice(0,8).map(function(x){return {area:x.area,service:x.service,monthly_cost_usd:x.monthly_cost_usd}}),
    metricsSource:p.metricsSource||"not_connected",
    metrics:p.metricsSource==="connected"?p.metrics:undefined,
    functionalBuild:p.functionalBuild?{
      bid:p.functionalBuild.bid,
      verification:p.functionalBuild.verification?{status:p.functionalBuild.verification.status}:null,
      deployment:p.functionalBuild.deployment?{readyState:p.functionalBuild.deployment.readyState}:null
    }:undefined,
    decisions:(p.decisions||[]).slice(0,4),
    agentCycle:p.agentCycle?{bottleneck:p.agentCycle.bottleneck,next_action:p.agentCycle.next_action,action_status:p.agentCycle.action_status}:undefined,
    phoneTest:p.phoneTest?{notes:String(p.phoneTest.notes||"").slice(0,300)}:undefined,
    risks:(p.risks||[]).slice(0,4),
    buildPlan:(p.buildPlan||[]).slice(0,4).map(function(x){return {title:x.title,deliverable:x.deliverable}})
  };
}
async function callRuntime(mode,p){
  var url=runtimeUrl();if(!url)throw new Error("Runtime endpoint가 없습니다.");
  var payload=JSON.stringify({mode:mode,project:compactRuntimeProject(p)});
  setRunStage("request","Session context 전송 · "+payload.length+" bytes");
  var responsePromise=fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:payload});
  setRunStage("waiting",mode==="cycle"?"GPT 역할별 검토·병목 판단 대기 중":"GPT Blueprint 생성 대기 중");
  var resp=await responsePromise;
  setRunStage("apply","API 응답 수신 · 결과 검증 및 세션 저장");
  var data=await resp.json().catch(function(){return {error:"Runtime returned non-JSON response"}});
  if(!resp.ok||!data.ok)throw new Error((data.error||("HTTP "+resp.status))+(data.stage?" · "+data.stage:""));
  return data
}
function applyAnalysis(data,p){
  var a=data.analysis||{};
  if(a.venture_name)p.name=a.venture_name;
  if(a.target_customer)p.customer=a.target_customer;
  if(a.problem)p.problem=a.problem;
  if(a.monetization)p.model=a.monetization;
  if(Number.isFinite(a.recommended_price_usd))p.price=a.recommended_price_usd;
  if(Number.isFinite(a.venture_score))p.score=a.venture_score;
  p.summary=a.executive_summary||p.summary;
  p.mvpFeatures=a.mvp_features||p.mvpFeatures;p.techStack=a.tech_stack||p.techStack;
  p.serviceFlow=a.service_flow||p.serviceFlow;p.buildPlan=a.build_plan||p.buildPlan;
  p.costBreakdown=a.cost_breakdown||p.costBreakdown;p.risks=a.risks||p.risks;
  p.launchGates=a.launch_gates||p.launchGates;p.nextExperiment=a.next_experiment||p.nextExperiment;
  p.agentNotes=a.agent_notes||p.agentNotes;
  p.estimatedMvpCost=a.estimated_mvp_external_cost_usd;p.estimatedOpsCost=a.estimated_monthly_ops_usd_at_1000_mau;
  if(a.next_action)p.decisions.unshift(a.next_action);
  p._phase="blueprint";p._briefStale=false;
  addEventToSession(p,"blueprint_completed","Blueprint generated",{model:data.model});
}
function applyCycle(data,p){
  var a=data.cycle;
  if(!a||!a.next_action||!a.role_notes)throw new Error("Cycle response missing decision data");
  var cycle={
    bottleneck:a.bottleneck,evidence:a.evidence,evidence_level:a.evidence_level,
    decision:a.decision,rationale:a.rationale,experiment:a.experiment,
    next_action:a.next_action,success_metric:a.success_metric,
    success_threshold:a.success_threshold,
    estimated_external_cost_usd:a.estimated_external_cost_usd,
    human_approval_required:a.human_approval_required,
    missing_evidence:a.missing_evidence,role_notes:a.role_notes,
    action_status:"pending", // GPT has not actually executed external tasks
    at:new Date().toISOString(),model:data.model,response_id:data.response_id,
    latency_ms:data.latency_ms,
    actual_api_cost_usd:Number(data.cost&&data.cost.provider_usd||0)
  };
  p.agentCycle=cycle;
  p.agentCycleHistory=[cycle].concat(p.agentCycleHistory||[]).slice(0,12);
  p.nextExperiment=a.experiment;
  p.decisions.unshift("Cycle decision: "+a.next_action);
  if(p.decisions.length>40)p.decisions=p.decisions.slice(0,40);
  addEventToSession(p,"agent_cycle_completed","Decision generated; action pending",{response_id:data.response_id,cost:cycle.actual_api_cost_usd,bottleneck:a.bottleneck});
}
async function run(mode){
  if(state.running)return;
  mode=mode==="cycle"?"cycle":"analyze";
  var p=state.p,sessionId=p._sessionId;
  state.running=true;state.runMode=mode;state.runStage="prepare";
  state.runStartedAt=Date.now();
  state.runMessage=mode==="cycle"?"세션 컨텍스트 준비":"Founder brief 확인";
  state.runError="";render();startRunClock();
  try{
    var data=await callRuntime(mode,p);
    if(p._sessionId!==sessionId)throw new Error("Run session mismatch");
    if(mode==="cycle")applyCycle(data,p);else applyAnalysis(data,p);
    p.costs=p.costs||[];
    p.costs.unshift(["Startup OS Runtime","OpenAI / "+(data.model||"GPT"),mode==="cycle"?"Agent cycle":"Blueprint analysis",Number(data.cost&&data.cost.provider_usd||0),data.response_id||""]);
    p.runtimeLast={model:data.model||"GPT",tokens:String((data.usage&&data.usage.input_tokens||0)+(data.usage&&data.usage.output_tokens||0)),latency:String(data.latency_ms||0)+" ms",responseId:data.response_id||""};
    saveSessionWithoutSwitch(p);
    state.runStage="done";state.runMessage=mode==="cycle"?"역할별 의사결정 저장 완료 · 다음 액션 실행 대기":"Blueprint 저장 완료";
    state.runtimeStatus="live";toast("GPT "+(mode==="cycle"?"cycle":"analysis")+" complete");
  }catch(e){
    state.runtimeStatus="error";state.runStage="error";state.runError=e.message;state.runMessage=e.message;toast(e.message);
  }finally{
    state.running=false;state.runMode="";stopRunClock();render();
  }
}

var reset=document.getElementById("reset");if(reset)reset.onclick=function(){if(!confirm("이 브라우저의 모든 Venture 세션 데이터를 삭제할까요?"))return;localStorage.removeItem(SESSION_KEY);localStorage.removeItem("startupOS.project");sessionPack=loadSessionPack();state.p=activeSession();render();toast("Local sessions cleared")};
var saveRt=document.getElementById("saveRuntime");if(saveRt)saveRt.onclick=function(){var v=document.getElementById("runtimeEndpoint").value.trim();if(v&&v.endsWith("/"))v=v.slice(0,-1);localStorage.setItem("startupOS.runtimeUrl",v);state.runtimeStatus="unknown";render();toast("Runtime endpoint saved")};
var testRt=document.getElementById("testRuntime");if(testRt)testRt.onclick=testRuntime;
var create=document.getElementById("createVenture");if(create)create.onclick=function(){
  var idea=document.getElementById("newIdea").value.trim();
  var customer=document.getElementById("newCustomer").value.trim();
  var problem=document.getElementById("newProblem").value.trim();
  if(!idea||!customer||!problem){toast("아이디어·사용자·문제는 꼭 입력해주세요");return}
  var name=document.getElementById("newName").value.trim()||idea.replace(/[^가-힣a-zA-Z0-9 ]/g," ").trim().split(/\s+/).slice(0,4).join(" ")||"New Venture";
  var project={
    name:name,idea:idea,customer:customer,problem:problem,
    desiredOutcome:document.getElementById("newOutcome").value.trim(),
    model:document.getElementById("newModel").value||"AI가 추천",
    price:Number(document.getElementById("newPrice").value||0),
    budget:Number(document.getElementById("newBudget").value||100),
    constraints:document.getElementById("newConstraints").value.trim(),
    stage:"Discovery",score:50,metrics:{visitors:0,activation:0,trial:0,paid:0,mrr:0},
    costs:[],decisions:["새 Venture 생성: founder brief 입력 완료"],
    mvpFeatures:[],techStack:[],serviceFlow:[],buildPlan:[],costBreakdown:[],risks:[],launchGates:[],
    nextExperiment:"",summary:"AI가 서비스 구조를 설계 중입니다.",estimatedMvpCost:0,estimatedOpsCost:0,agentNotes:{}
  };
  if(state.modalMode==="edit"){
    var current=state.p,old=[current.idea,current.problem,current.customer,current.desiredOutcome,current.constraints].join("|");
    Object.assign(current,{name:project.name,idea:project.idea,customer:project.customer,problem:project.problem,desiredOutcome:project.desiredOutcome,model:project.model,price:project.price,budget:project.budget,constraints:project.constraints});
    if(old!==[current.idea,current.problem,current.customer,current.desiredOutcome,current.constraints].join("|")){current._briefStale=true;current._phase="brief";}
    addSessionEvent("brief_updated","Founder brief updated");save();state.modal=false;state.view="venture";render();toast("Brief saved");return;
  }
  createSession(project,"manual");state.modal=false;state.view="venture";render();run("analyze");
};
}
render();
})();
</script>
</body>
</html>
