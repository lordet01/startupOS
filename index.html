function item(a,b){return '<div class="item"><div><b>'+esc(a)+'</b><div>'+esc(b)+'</div></div></div>'}
function runStageIndex(){return {prepare:0,request:1,waiting:2,apply:3,done:4,error:4}[state.runStage]||0}
function elapsedSeconds(){return state.runStartedAt?Math.max(0,(Date.now()-state.runStartedAt)/1000):0}

function serviceMeta(name){var n=String(name||"").toLowerCase(),m={label:name,url:"",icon:""};if(n.includes("vercel"))return {label:name,url:"https://vercel.com/",icon:"https://cdn.simpleicons.org/vercel/ffffff"};if(n.includes("firebase"))return {label:name,url:"https://firebase.google.com/",icon:"https://cdn.simpleicons.org/firebase/FFCA28"};if(n.includes("supabase"))return {label:name,url:"https://supabase.com/",icon:"https://cdn.simpleicons.org/supabase/3FCF8E"};if(n.includes("openai")||n.includes("gpt"))return {label:name,url:"https://platform.openai.com/",icon:"https://cdn.simpleicons.org/openai/ffffff"};if(n.includes("stripe"))return {label:name,url:"https://stripe.com/",icon:"https://cdn.simpleicons.org/stripe/635BFF"};if(n.includes("posthog"))return {label:name,url:"https://posthog.com/",icon:"https://cdn.simpleicons.org/posthog/F9BD2B"};if(n.includes("resend"))return {label:name,url:"https://resend.com/",icon:"https://cdn.simpleicons.org/resend/ffffff"};if(n.includes("google cloud")||n.includes("vision ocr"))return {label:name,url:"https://cloud.google.com/vision",icon:"https://cdn.simpleicons.org/googlecloud/4285F4"};if(n.includes("github"))return {label:name,url:"https://github.com/",icon:"https://cdn.simpleicons.org/github/ffffff"};return m}

function phoneView(){var p=state.p,d=p.deployment,t=p.phoneTest||{};return shell('<div class="stageHero"><div class="eyebrow">SESSION '+shortSessionId(p)+' · PHONE TEST</div><h2>내 폰에 넣어 실제 생활에서 써봅니다.</h2><p>배포 URL을 휴대폰에서 열고 홈 화면에 추가한 뒤 실제 사용 중 발견한 문제를 같은 Venture Session에 기록합니다.</p></div>'+lifecycleStepper(p)+(d?'<section class="section grid g2"><div class="card"><h2>1. 휴대폰에서 열기</h2><a class="deployUrl" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.url)+' ↗</a><div class="row" style="margin-top:14px"><button class="btn" id="copyDeployUrl">Copy URL</button><button class="btn '+(t.opened?"primary":"")+'" id="markOpened">'+(t.opened?"✓ Opened on phone":"Mark opened on phone")+'</button></div><div class="callout" style="margin-top:14px"><b>iPhone</b>: Safari → 공유 → 홈 화면에 추가<br><b>Android</b>: Chrome → 메뉴 → 앱 설치 / 홈 화면에 추가</div></div><div class="card"><h2>2. Web App 설치 확인</h2><div class="phoneMock"><div class="phoneScreen"><div class="eyebrow">PHONE TEST</div><h2>'+esc(p.name)+'</h2><p class="small">실제 배포 앱을 홈 화면에서 standalone으로 실행해보세요.</p><div style="margin-top:30px" class="tag '+(t.installed?"ok":"")+'">'+(t.installed?"Installed ✓":"Not confirmed")+'</div></div></div><div class="row" style="margin-top:14px;justify-content:center"><button class="btn primary" id="markInstalled">'+(t.installed?"✓ Installed":"Mark installed as web app")+'</button></div></div></section><section class="section card"><h2>3. 실제 사용 피드백</h2><div class="field"><label>써보면서 불편했던 점 / 다음에 고칠 것</label><textarea id="phoneNotes" placeholder="예: 첫 화면에서 영수증 촬영 버튼이 더 커야 함">'+esc(t.notes||"")+'</textarea></div><div class="row" style="margin-top:12px"><button class="btn" id="savePhoneNotes">Save feedback</button><button class="btn primary" id="startIteration">Start next iteration →</button></div></section>':'<section class="section card"><div class="loadingPanel"><b>Phone Test 전에 배포가 필요합니다.</b>Deploy 단계에서 실제 URL을 만든 뒤 진행하세요.</div></section>'))}

v class="callout" style="margin-top:14px"><b>다음 단계에서 자동 설계</b><br>사용자 흐름 → MVP 기능 → OCR/AI/DB/결제 등 필요한 기술 → 구체 SaaS/API → 초기비/월비용 → 구현 Phase → 첫 시장검증까지 생성합니다.</div><div class="row" style="justify-content:space-between;margin-top:16px"><div class="row"><button class="btn" id="loadTravel">예시 · 여행 ToDo</button><button class="btn" id="loadOcr">예시 · OCR 가계부</button></div><button class="btn primary" id="createVenture">'+(edit?"Save & re-design with GPT →":"Create & design with GPT →")+'</button></div></div></div>'

function render(){var map={sessions:sessionsView,overview:overview,venture:venture,build:buildView,deploy:deployView,phone:phoneView,agents:agentView,cost:costView,growth:growth,settings:settings};document.getElementById("app").innerHTML=(map[state.view]||overview)()+(state.modal?modal():"");bind()}
function toast(msg){var d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
async function callRuntime(mode){var url=runtimeUrl();if(!url)throw new Error("Runtime endpoint가 없습니다. Settings에서 Vercel runtime URL을 연결하세요.");setRunStage("request","Vercel /api/runtime으로 Venture State를 전송했습니다.");var respPromise=fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:mode,project:state.p})});setRunStage("waiting","OpenAI가 서비스 흐름·기술·비용·구현 계획을 구조화된 JSON으로 생성 중입니다.");var resp=await respPromise;setRunStage("apply","응답을 수신했습니다. JSON Schema와 비용 정보를 검증하고 화면에 반영합니다.");var data=await resp.json().catch(function(){return {error:"Invalid runtime response"}});if(!resp.ok||!data.ok)throw new Error(data.error||("Runtime HTTP "+resp.status));return data}
function applyAnalysis(data){var a=data.analysis||{};if(a.venture_name)state.p.name=a.venture_name;if(a.target_customer)state.p.customer=a.target_customer;if(a.problem)state.p.problem=a.problem;if(a.monetization)state.p.model=a.monetization;if(Number.isFinite(a.recommended_price_usd))state.p.price=a.recommended_price_usd;if(Number.isFinite(a.venture_score))state.p.score=a.venture_score;state.p.summary=a.executive_summary||state.p.summary;state.p.mvpFeatures=a.mvp_features||state.p.mvpFeatures;state.p.techStack=a.tech_stack||state.p.techStack;state.p.serviceFlow=a.service_flow||state.p.serviceFlow;state.p.buildPlan=a.build_plan||state.p.buildPlan;state.p.costBreakdown=a.cost_breakdown||state.p.costBreakdown;state.p.risks=a.risks||state.p.risks;state.p.launchGates=a.launch_gates||state.p.launchGates;state.p.nextExperiment=a.next_experiment||state.p.nextExperiment;state.p.agentNotes=a.agent_notes||state.p.agentNotes;state.p.estimatedMvpCost=a.estimated_mvp_external_cost_usd;state.p.estimatedOpsCost=a.estimated_monthly_ops_usd_at_1000_mau;if(a.next_action)state.p.decisions.unshift(a.next_action);if(a.next_experiment)state.p.decisions.unshift("실험: "+a.next_experiment);var provider=Number(data.cost&&data.cost.provider_usd||0);state.p.costs.unshift(["Startup OS Runtime","OpenAI / "+(data.model||"GPT"),data.mode||"analyze",provider]);state.p.runtimeLast={model:data.model||"GPT",tokens:String((data.usage&&data.usage.input_tokens||0)+(data.usage&&data.usage.output_tokens||0)),latency:String(data.latency_ms||0)+" ms",responseId:data.response_id||""};state.p._phase="blueprint";addSessionEvent("blueprint_completed","AI Venture Blueprint completed",{model:data.model,cost:data.cost&&data.cost.provider_usd});state.runtimeStatus="live";save()}
async function run(mode){if(state.running)return;state.running=true;state.runStage="prepare";state.runStartedAt=Date.now();state.runMessage="Founder brief를 정리하고 실제 Runtime 요청을 준비합니다.";state.runError="";render();startRunClock();try{var data=await callRuntime(mode||"cycle");applyAnalysis(data);state.runStage="done";state.runMessage="실제 OpenAI 응답을 Venture State에 반영했습니다. Cost Ledger도 업데이트되었습니다.";state.runtimeStatus="live";toast("GPT venture decision complete · "+money(data.cost.provider_usd)+" API cost")}catch(e){state.runtimeStatus="error";state.runStage="error";state.runError=e.message;state.runMessage=e.message;toast(e.message)}finally{state.running=false;stopRunClock();render()}}
async function generateMvp(){if(state.builderRunning)return;if(!(state.p.serviceFlow&&state.p.serviceFlow.length)){toast("먼저 Venture Blueprint를 생성하세요");state.view="venture";render();return}state.builderRunning=true;state.builderError="";state.builderMessage="OpenAI Builder가 현재 Session Blueprint를 읽고 실제 HTML/PWA를 구현 중입니다.";render();try{var r=await fetch("/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project:state.p})});var data=await r.json().catch(function(){return {error:"Invalid builder response"}});if(!r.ok||!data.ok)throw new Error(data.error||("Builder HTTP "+r.status));state.p.prototype=Object.assign({},data.build,{_model:data.model,_tokens:(data.usage.input_tokens||0)+(data.usage.output_tokens||0),_latency:data.latency_ms,_builtAt:new Date().toISOString()});state.p.costs.unshift(["Builder Runtime","OpenAI / "+(data.model||"GPT"),"MVP Build",Number(data.cost&&data.cost.provider_usd||0)]);state.p._phase="build";addSessionEvent("build_completed","Working MVP generated",{model:data.model,cost:data.cost&&data.cost.provider_usd});save();toast("Working MVP generated")}catch(e){state.builderError=e.message;toast(e.message)}finally{state.builderRunning=false;render()}}
function openPrototype(){if(!state.p.prototype)return;var blob=new Blob([state.p.prototype.index_html],{type:"text/html"});var url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(function(){URL.revokeObjectURL(url)},60000)}
async function publishMvp(){if(state.publishRunning||!state.p.prototype)return;state.publishRunning=true;state.publishError="";state.publishMessage="Generated PWA files를 Vercel production project로 전송 중입니다.";render();try{var r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:state.p._sessionId,build:state.p.prototype})});var data=await r.json().catch(function(){return {error:"Invalid publish response"}});if(!r.ok||!data.ok)throw new Error(data.error||("Publish HTTP "+r.status));state.p.deployment=data.deployment;state.p._phase="deploy";addSessionEvent("deployment_created","Vercel deployment created",{url:data.deployment.url,id:data.deployment.id});save();toast("Vercel deployment created")}catch(e){state.publishError=e.message;toast(e.message)}finally{state.publishRunning=false;render()}}
function updatePhoneTest(patch){state.p.phoneTest=Object.assign({},state.p.phoneTest||{},patch,{updatedAt:new Date().toISOString()});state.p._phase="test";addSessionEvent("phone_test_updated","Phone test updated",patch);save();render()}
function captureThesis(){["name","idea","customer","problem","model","price","budget"].forEach(function(k){var el=document.getElementById(k);if(!el)return;state.p[k]=(k==="price"||k==="budget")?Number(el.value):el.value});save()}
async function testRuntime(){var url=runtimeUrl();if(!url){toast("Runtime endpoint를 먼저 저장하세요");return}try{var r=await fetch(url);var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Runtime unavailable");state.runtimeStatus="live";render();toast("Runtime live · "+d.model)}catch(e){state.runtimeStatus="error";render();toast("Runtime test failed: "+e.message)}}
function loadTravelTemplate(){createSession(TRAVEL_TEMPLATE,"example-travel");state.modal=false;state.view="venture";render();toast("New Travel ToDo session created")}
function loadOcrTemplate(){createSession(OCR_LEDGER_TEMPLATE,"example-ocr");state.modal=false;state.view="venture";render();toast("New OCR Ledger session created")}

function bind(){
document.querySelectorAll("[data-view]").forEach(function(b){b.onclick=function(){state.view=b.dataset.view;render()}});var ss=document.getElementById("sessionSelect");if(ss)ss.onchange=function(){switchSession(ss.value)};document.querySelectorAll(".openSession").forEach(function(b){b.onclick=function(){switchSession(b.dataset.session)}});
var n=document.getElementById("newVenture");if(n)n.onclick=function(){state.modalMode="new";state.modal=true;render()};var eb=document.getElementById("editBrief");if(eb)eb.onclick=function(){state.modalMode="edit";state.modal=true;render()};
var cbtn=document.getElementById("closeModal");if(cbtn)cbtn.onclick=function(){state.modal=false;render()};var gm=document.getElementById("generateMvp");if(gm)gm.onclick=generateMvp;var op=document.getElementById("openPrototype");if(op)op.onclick=openPrototype;var pm=document.getElementById("publishMvp");if(pm)pm.onclick=publishMvp;var cu=document.getElementById("copyDeployUrl");if(cu)cu.onclick=function(){if(state.p.deployment&&navigator.clipboard){navigator.clipboard.writeText(state.p.deployment.url);toast("URL copied")}};var mo=document.getElementById("markOpened");if(mo)mo.onclick=function(){updatePhoneTest({opened:true})};var mi=document.getElementById("markInstalled");if(mi)mi.onclick=function(){updatePhoneTest({installed:true})};var sn=document.getElementById("savePhoneNotes");if(sn)sn.onclick=function(){updatePhoneTest({notes:document.getElementById("phoneNotes").value});toast("Phone feedback saved")};var si=document.getElementById("startIteration");if(si)si.onclick=function(){var notes=document.getElementById("phoneNotes")?document.getElementById("phoneNotes").value:"";state.p.phoneTest=Object.assign({},state.p.phoneTest||{},{notes:notes,updatedAt:new Date().toISOString()});state.p._phase="iterate";addSessionEvent("iteration_started","Founder started next iteration",{notes:notes});save();state.view="growth";render()};
document.querySelectorAll("#runCycle").forEach(function(r){r.onclick=function(){run("cycle")}});
document.querySelectorAll("#analyzeNow").forEach(function(r){r.onclick=function(){captureThesis();run("analyze")}});
document.querySelectorAll("#loadTravel").forEach(function(r){r.onclick=loadTravelTemplate});document.querySelectorAll("#loadOcr").forEach(function(r){r.onclick=loadOcrTemplate});
document.querySelectorAll("[data-toast]").forEach(function(b){b.onclick=function(){toast(b.dataset.toast)}});
var s=document.getElementById("saveThesis");if(s)s.onclick=function(){captureThesis();toast("Venture thesis saved")};
var a=document.getElementById("addCost");if(a)a.onclick=function(){state.p.costs.unshift(["Manual test","External API","Test",1.25]);save();render()};
var sim=document.getElementById("simulate");if(sim)sim.onclick=function(){var m=state.p.metrics;m.visitors+=200;m.activation=+(m.activation+1.7).toFixed(1);m.trial=+(m.trial+.9).toFixed(1);m.paid=+(m.paid+.4).toFixed(1);m.mrr=+(m.mrr+state.p.price*8).toFixed(2);save();render();toast("200 sessions simulated")};
var reset=document.getElementById("reset");if(reset)reset.onclick=function(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem("startupOS.project");sessionPack=loadSessionPack();state.p=activeSession();render();toast("All local sessions reset")};
var saveRt=document.getElementById("saveRuntime");if(saveRt)saveRt.onclick=function(){var v=document.getElementById("runtimeEndpoint").value.trim();if(v&&v.endsWith("/"))v=v.slice(0,-1);localStorage.setItem("startupOS.runtimeUrl",v);state.runtimeStatus="unknown";render();toast("Runtime endpoint saved")};
var testRt=document.getElementById("testRuntime");if(testRt)testRt.onclick=testRuntime;
var create=document.getElementById("createVenture");if(create)create.onclick=function(){
  var idea=document.getElementById("newIdea").value.trim();
  var customer=document.getElementById("newCustomer").value.trim();
  var problem=document.getElementById("newProblem").value.trim();
  if(!idea||!customer||!problem){toast("아이디어·사용자·문제는 꼭 입력해주세요");return}
  var name=document.getElementById("newName").value.trim()||idea.replace(/[^가-힣a-zA-Z0-9 ]/g," ").trim().split(/\s+/).slice(0,4).join(" ")||"New Venture";
  var project={
    name:name,idea:idea,customer:customer,problem:problem,
    desiredOutcome:document.getElementById("newOutcome").value.trim(),
    model:document.getElementById("newModel").value||"AI가 추천",
    price:Number(document.getElementById("newPrice").value||0),
    budget:Number(document.getElementById("newBudget").value||100),
    constraints:document.getElementById("newConstraints").value.trim(),
    stage:"Discovery",score:50,metrics:{visitors:0,activation:0,trial:0,paid:0,mrr:0},
    costs:[],decisions:["새 Venture 생성: founder brief 입력 완료"],
    mvpFeatures:[],techStack:[],serviceFlow:[],buildPlan:[],costBreakdown:[],risks:[],launchGates:[],
    nextExperiment:"",summary:"AI가 서비스 구조를 설계 중입니다.",estimatedMvpCost:0,estimatedOpsCost:0,agentNotes:{}
  };
  createSession(project,"manual");state.modal=false;state.view="venture";render();run("analyze");
};
}
render();
})();
</script>
