<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Startup OS Pilot</title>
<style>
:root{--bg:#08111f;--panel:#0f1d32;--panel2:#142642;--line:#263a57;--text:#f6f9ff;--muted:#91a4bf;--blue:#638cff;--green:#45d7aa;--amber:#ffbf63}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#183d70 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;background:#08111fee}.brand{font-size:20px;font-weight:900;margin:4px 8px 24px}.brand i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#78a0ff,#665dff);font-style:normal;margin-right:8px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left}.nav button.on,.nav button:hover{background:#142642;color:white}.small{font-size:12px;color:var(--muted)}.side .small{position:absolute;bottom:20px}.main{min-width:0}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 26px;position:sticky;top:0;background:#08111fdc;backdrop-filter:blur(14px);z-index:4}.content{max-width:1380px;margin:auto;padding:28px}.hero,.card{background:linear-gradient(180deg,#11223a,#0d192b);border:1px solid var(--line);border-radius:18px}.hero{padding:30px;background:linear-gradient(135deg,#17355d,#0d1b30)}h1{font-size:36px;letter-spacing:-1px;margin:7px 0 10px}h2{font-size:20px;margin:0 0 12px}.hero p{max-width:800px;color:#bdc9da;line-height:1.65}.eyebrow{color:#a9c0ec;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.btn{border:1px solid var(--line);background:#152844;color:white;padding:10px 14px;border-radius:10px;font-weight:750;font-size:13px}.btn.primary{border:0;background:linear-gradient(135deg,#628dff,#7166ff)}.row{display:flex;gap:9px;flex-wrap:wrap}.section{margin-top:22px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.metric b{display:block;font-size:27px;margin:7px 0}.metric span{font-size:12px;color:var(--muted)}.green{color:var(--green)!important}.amber{color:var(--amber)!important}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid #2f5376;background:#112742;color:#cbe0ff}.tag.ok{border-color:#286e58;background:#0d2c24;color:#9aefd3}.list{display:grid}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #223551}.item:last-child{border-bottom:0}.item b{font-size:13px}.item div div{font-size:11px;color:var(--muted);margin-top:4px}.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.agent{border:1px solid var(--line);background:#0b1728;border-radius:13px;padding:13px}.agent b{font-size:13px}.agent p{font-size:11px;color:var(--muted);line-height:1.45}.stack{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:10px;background:#0b1728;padding:8px 10px;font-size:12px}.chip strong{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#1c385f;margin-right:6px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #2d4463;background:#081522;color:white;padding:10px 11px;border-radius:9px;outline:none}.field textarea{min-height:90px}.callout{border:1px solid #31557f;background:#102541;border-radius:12px;padding:13px;color:#c9d8ed;font-size:12px;line-height:1.55}.gate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.gate div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px}.gate .pass{border-color:#27674f;background:#0d291f}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:10px;border-bottom:1px solid #223551;text-align:left}.table th{color:var(--muted)}.right{text-align:right!important}.hide{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:white;color:#08111f;padding:11px 14px;border-radius:10px;font-weight:800;box-shadow:0 15px 50px #0008}.modalWrap{position:fixed;inset:0;background:#02070fc7;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(720px,100%);background:#0c192c;border:1px solid #315071;border-radius:18px;padding:20px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{border:1px solid var(--line);background:#0b1728;padding:12px;border-radius:11px}.kpi span{display:block;font-size:11px;color:var(--muted)}.kpi b{font-size:19px}
@media(max-width:900px){.shell{grid-template-columns:70px 1fr}.brand{font-size:0}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:18px}.g4,.agents{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.side{position:fixed;bottom:0;top:auto;width:100%;height:64px;border-right:0;border-top:1px solid var(--line);z-index:10;padding:8px}.brand,.side .small{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button:nth-child(n+6){display:none}.main{padding-bottom:68px}.top{padding:0 13px}.content{padding:15px}.g4,.agents,.form,.kpis{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:22px}h1{font-size:28px}.gate{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var DEFAULT={name:"PhotoStory",idea:"부모가 아이 사진을 올리면 AI가 짧은 동화책을 만들어주는 모바일 웹앱",customer:"3~8세 자녀를 둔 부모",problem:"아이 사진을 의미 있는 콘텐츠로 남기고 싶지만 직접 만드는 것은 번거롭다.",model:"건당 결제 + 크레딧",price:4.99,budget:100,stage:"Validation",score:74,metrics:{visitors:1240,activation:32,trial:11,paid:3.8,mrr:238},costs:[["Market Agent","GPT","Planning",.42],["Product Agent","GPT","Planning",.31],["Builder Harness","GPT","Development",2.84],["QA Agent","GPT","QA",.76]],decisions:["MVP를 모바일 웹/PWA로 제한","구독보다 건당 결제를 1차 실험","AI 원가가 판매가의 25%를 넘으면 모델 재선정"]};
var state={view:"overview",p:load(),running:false,modal:false};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem("startupOS.project"))||clone(DEFAULT)}catch(e){return clone(DEFAULT)}}
function save(){localStorage.setItem("startupOS.project",JSON.stringify(state.p))}
function money(n){return "$"+Number(n).toFixed(n<10?2:0)}
function spend(){return state.p.costs.reduce(function(s,x){return s+x[3]},0)}
function fee(){return spend()*.05}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nav(){var a=[["overview","Overview"],["venture","Venture Lab"],["agents","Agents"],["cost","Cost Ledger"],["launch","Launch"],["growth","Growth"],["settings","Settings"]];return '<aside class="side"><div class="brand"><i>S</i>Startup OS</div><div class="nav">'+a.map(function(x){return '<button data-view="'+x[0]+'" class="'+(state.view===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div><div class="small">Pilot v0.1<br>GitHub Pages</div></aside>'}
function shell(body){return '<div class="shell">'+nav()+'<main class="main"><header class="top"><div class="small">'+esc(state.p.name)+' · '+state.p.stage+'</div><div class="row"><span class="tag ok">Demo Runtime</span><button class="btn" id="newVenture">+ New venture</button></div></header><div class="content">'+body+'</div></main></div>'}
function metric(t,v,n,c){return '<div class="card metric"><span>'+t+'</span><b class="'+(c||"")+'">'+v+'</b><span>'+n+'</span></div>'}
function agents(){var a=[["CEO","Goal / priority / gate"],["Market","Customer / competition"],["Product","MVP / UX / conversion"],["Finance","Cost / pricing / margin"],["Tech","Architecture / APIs"],["Builder","Implementation / deploy"],["Legal","Privacy / IP / policy"],["Growth","Acquisition / experiments"]];return '<div class="agents">'+a.map(function(x,i){return '<div class="agent"><div class="head"><b>'+x[0]+' Agent</b><span class="tag '+(i<4?"ok":"")+'">'+(state.running&&i<3?"Running":i<4?"Ready":"Idle")+'</span></div><p>'+x[1]+'</p></div>'}).join("")+'</div>'}
function gates(){return '<div class="gate"><div class="pass">✓<br><b>Problem</b></div><div class="pass">✓<br><b>Customer</b></div><div class="pass">✓<br><b>MVP</b></div><div>!<br><b>Payment</b></div><div>!<br><b>Legal</b></div></div>'}
function overview(){var p=state.p,s=spend(),ready=Math.min(100,Math.round((p.score+18)/1.18));return shell('<section class="hero"><div class="eyebrow">AI Venture Operating System</div><h1>아이디어가 아니라 <span style="color:#89a8ff">수익화되는 사업</span>을 만듭니다.</h1><p>'+esc(p.idea)+'</p><div class="row" style="margin-top:20px"><button class="btn primary" id="runCycle">'+(state.running?"Agents running…":"Run next venture cycle")+'</button><button class="btn" data-view="venture">Edit venture thesis</button></div></section><section class="section grid g4">'+metric("Venture Score",p.score+"/100","시장성 · 실행성 · 원가 · 위험",p.score>=70?"green":"amber")+metric("MVP Readiness",ready+"%","Launch gate 기준",ready>=80?"green":"")+metric("External Cost",money(s),"기획 + 개발 + 테스트")+metric("Startup OS Fee",money(fee()),"외부 실비의 5%")+'</section><section class="section grid g2"><div class="card"><div class="head"><h2>Venture thesis</h2><span class="tag ok">'+p.stage+'</span></div><div class="list">'+item("Target customer",p.customer)+item("Problem",p.problem)+item("Monetization",p.model+" · "+money(p.price))+item("MVP budget",money(p.budget))+'</div></div><div class="card"><h2>Recommended stack</h2><div class="stack">'+["GPT","Firebase","Vercel","GitHub","Stripe","PostHog","Resend"].map(function(x){return '<span class="chip"><strong>'+x.charAt(0)+'</strong>'+x+'</span>'}).join("")+'</div><div class="callout" style="margin-top:14px">AI가 없어도 가능한 작업은 rule/DB로 처리하고, 복잡도에 따라 가장 가성비 좋은 API를 선택합니다.</div></div></section><section class="section"><div class="head"><div><h2>Agent board</h2><div class="small">필요한 역할만 실행하는 goal-driven scheduler</div></div><button class="btn" data-view="agents">Open agents</button></div>'+agents()+'</section><section class="section grid g2"><div class="card"><h2>Launch gate</h2>'+gates()+'</div><div class="card"><h2>Decision log</h2><div class="list">'+p.decisions.map(function(x,i){return item((i+1)+". "+x,"Venture CEO decision")}).join("")+'</div></div></section>')}
function item(a,b){return '<div class="item"><div><b>'+esc(a)+'</b><div>'+esc(b)+'</div></div></div>'}
function venture(){var p=state.p;return shell('<div class="head"><div><h2 style="font-size:27px">Venture Lab</h2><div class="small">문제·고객·수익모델을 먼저 고정하고 개발합니다.</div></div><button class="btn primary" id="saveThesis">Save thesis</button></div><div class="grid g2"><div class="card"><div class="form"><div class="field full"><label>Venture name</label><input id="name" value="'+esc(p.name)+'"></div><div class="field full"><label>Idea</label><textarea id="idea">'+esc(p.idea)+'</textarea></div><div class="field"><label>Target customer</label><input id="customer" value="'+esc(p.customer)+'"></div><div class="field"><label>Business model</label><select id="model"><option>건당 결제 + 크레딧</option><option>월 구독</option><option>Freemium + 구독</option><option>광고 + IAP</option></select></div><div class="field full"><label>Problem</label><textarea id="problem">'+esc(p.problem)+'</textarea></div><div class="field"><label>Selling price (USD)</label><input id="price" type="number" step=".01" value="'+p.price+'"></div><div class="field"><label>MVP budget (USD)</label><input id="budget" type="number" value="'+p.budget+'"></div></div></div><div class="card"><div class="head"><h2>AI feasibility brief</h2><span class="tag ok">GO · validate</span></div><div class="list">'+item("Customer clarity","Good · 구체 고객군으로 시작 가능")+item("Problem urgency","Medium · 구매의향 검증 필요")+item("Technical feasibility","High · Web/PWA + API")+item("Cost risk","Medium · AI 원가 주문 단위 제한")+item("Legal risk","Review · 개인정보/IP/미성년자 여부 확인")+'</div><div class="callout" style="margin-top:14px"><b>First experiment:</b> Landing → 가치 미리보기 → 가격 노출 → 결제 의도 측정. 코딩 전에 유료 의향부터 확인합니다.</div></div></div><section class="section card"><h2>Technology budget architect</h2><table class="table"><tr><th>Capability</th><th>Choice</th><th>Reason</th><th class="right">Pilot cost</th></tr><tr><td>Reasoning / build</td><td>OpenAI GPT API</td><td>고성능 모델은 복잡 작업에만</td><td class="right">$6–25</td></tr><tr><td>Backend</td><td>Firebase</td><td>Auth + Firestore + Storage</td><td class="right">$0–10/mo</td></tr><tr><td>Hosting</td><td>GitHub Pages → Vercel</td><td>Pilot 무료, 서버 필요 시 전환</td><td class="right">$0</td></tr><tr><td>Payment</td><td>Stripe</td><td>Checkout 우선</td><td class="right">transaction</td></tr><tr><td>Analytics</td><td>PostHog</td><td>퍼널/실험 중심</td><td class="right">$0 tier</td></tr></table></section>')}
function agentView(){return shell('<div class="head"><div><h2 style="font-size:27px">Agent Control Room</h2><div class="small">Evidence → Decision → Action</div></div><button class="btn primary" id="runCycle">Run next cycle</button></div>'+agents()+'<section class="section grid g2"><div class="card"><h2>Scheduler policy</h2><div class="list">'+item("Goal","첫 유료 고객 + 반복 가능한 획득 채널")+item("Current bottleneck","Activation → paid conversion")+item("Next action","결제 전 가치 미리보기 A/B 실험")+item("Budget cap","$10 / cycle")+item("Approval","배포·결제·광고비는 Human approval")+'</div></div><div class="card"><h2>Execution queue</h2><div class="list">'+item("1. Product Agent","온보딩 4→2 단계")+item("2. Builder Harness","Variant B 구현")+item("3. QA Agent","결제/세션 회귀 테스트")+item("4. Growth Agent","200 세션 실험")+item("5. CEO Agent","Keep / Kill 판정")+'</div></div></section>')}
function costView(){var s=spend(),f=fee();return shell('<div class="head"><div><h2 style="font-size:27px">Cost Ledger</h2><div class="small">모든 외부 비용과 수수료를 투명하게 추적</div></div><button class="btn" id="addCost">+ Add test cost</button></div><div class="grid g4">'+metric("External spend",money(s),"3rd party cost")+metric("Platform fee",money(f),"5% pilot fee")+metric("Customer bill",money(s+f),"실비 + Startup OS")+metric("Budget left",money(Math.max(0,state.p.budget-s-f)),"MVP budget")+'</div><section class="section card"><table class="table"><tr><th>Agent</th><th>Provider</th><th>Type</th><th class="right">External cost</th></tr>'+state.p.costs.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td class="right">'+money(x[3])+'</td></tr>'}).join("")+'</table></section><section class="section grid g2"><div class="card"><h2>Billing formula</h2><div class="callout"><b>Customer bill = External cost + Startup OS fee</b><br><br>Pilot fee: 5%. 실제 상품화 시 최소 수수료 또는 월 기본료 추가 가능.</div></div><div class="card"><h2>Cost guardrails</h2><div class="list">'+item("Agent cycle","$10 hard cap")+item("AI feature","Gross margin 70%+")+item("MVP build",money(state.p.budget)+" max")+item("Unexpected spike","Pause & approval")+'</div></div></section>')}
function launch(){return shell('<div class="head"><div><h2 style="font-size:27px">Launch Center</h2><div class="small">사업·기술·법률·계측 조건 확인</div></div><button class="btn primary" data-toast="Launch checklist prepared">Prepare launch</button></div><div class="card">'+gates()+'</div><section class="section grid g2"><div class="card"><h2>Checklist</h2><div class="list">'+item("Product","핵심 happy path 완료")+item("Analytics","activation / paid event 정의")+item("Payments","Stripe sandbox 검증 필요")+item("Legal","Privacy / Terms 검토 필요")+item("Ops","오류/비용 alert 준비")+'</div></div><div class="card"><h2>Human approval</h2><div class="callout">Production 배포, 실제 결제 활성화, 광고비 집행, 법률 정책 변경은 자동 실행하지 않고 승인 요청을 생성합니다.</div></div></section>')}
function growth(){var m=state.p.metrics;return shell('<div class="head"><div><h2 style="font-size:27px">Growth Loop</h2><div class="small">출시 후 숫자로 다음 실험을 결정</div></div><button class="btn primary" id="simulate">Simulate +200 sessions</button></div><div class="kpis">'+[["Visitors",m.visitors],["Activation",m.activation+"%"],["Trial intent",m.trial+"%"],["Paid",m.paid+"%"],["MRR",money(m.mrr)]].map(function(x){return '<div class="kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("")+'</div><section class="section grid g2"><div class="card"><h2>Current bottleneck</h2><div style="font-size:28px;font-weight:900;color:var(--amber);margin:15px 0">Activation → Paid</div><p class="small" style="line-height:1.7">광고 확장보다 사용자가 첫 가치를 경험하고 결제로 이동하는 구간을 먼저 고칩니다.</p></div><div class="card"><h2>Next experiment</h2><div class="list">'+item("Hypothesis","결제 전 미리보기 → paid intent 상승")+item("Variant B","30초 미리보기 + 즉시 가격")+item("Sample","200 qualified sessions")+item("Success gate","Paid intent ≥ 5%")+'</div></div></section>')}
function settings(){return shell('<div class="grid g2"><div class="card"><h2>AI runtime</h2><div class="callout"><b>Demo Runtime</b><br>GitHub Pages에 secret key를 노출하지 않습니다. 실제 AI는 다음 단계에서 Cloudflare Worker 또는 Firebase Function을 통해 연결합니다.</div></div><div class="card"><h2>Local data</h2><p class="small">현재 Venture 데이터는 이 브라우저 localStorage에 저장됩니다.</p><button class="btn" id="reset">Reset pilot data</button></div></div>')}
function modal(){return '<div class="modalWrap"><div class="modal"><div class="head"><div><div class="eyebrow">New venture</div><h2>무엇을 만들고 싶나요?</h2></div><button class="btn" id="closeModal">×</button></div><div class="form"><div class="field full"><label>아이디어</label><textarea id="newIdea" placeholder="예: 영수증을 찍으면 자동으로 지출을 분류해주는 서비스"></textarea></div><div class="field"><label>누가 쓰나요?</label><input id="newCustomer"></div><div class="field"><label>최대 MVP 예산 (USD)</label><input id="newBudget" type="number" value="100"></div></div><div class="callout" style="margin-top:12px">Startup OS가 문제정의 · MVP · 수익모델 · 기술스택 · 비용범위 · 위험 · 첫 실험을 생성합니다.</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="createVenture">Analyze venture</button></div></div></div>'}
function render(){var map={overview:overview,venture:venture,agents:agentView,cost:costView,launch:launch,growth:growth,settings:settings};document.getElementById("app").innerHTML=(map[state.view]||overview)()+(state.modal?modal():"");bind()}
function toast(msg){var d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
function run(){if(state.running)return;state.running=true;render();setTimeout(function(){state.running=false;state.p.score=Math.min(92,state.p.score+2);state.p.costs.unshift(["CEO + Product","Demo","Venture cycle",0]);state.p.decisions.unshift("다음 실험 우선순위 갱신: activation→paid 개선 우선");save();render();toast("Venture cycle complete")},1100)}
function bind(){
document.querySelectorAll("[data-view]").forEach(function(b){b.onclick=function(){state.view=b.dataset.view;render()}});
var n=document.getElementById("newVenture");if(n)n.onclick=function(){state.modal=true;render()};
var c=document.getElementById("closeModal");if(c)c.onclick=function(){state.modal=false;render()};
var r=document.getElementById("runCycle");if(r)r.onclick=run;
document.querySelectorAll("[data-toast]").forEach(function(b){b.onclick=function(){toast(b.dataset.toast)}});
var s=document.getElementById("saveThesis");if(s)s.onclick=function(){["name","idea","customer","problem","model","price","budget"].forEach(function(k){var el=document.getElementById(k);state.p[k]=(k==="price"||k==="budget")?Number(el.value):el.value});save();toast("Venture thesis saved")};
var a=document.getElementById("addCost");if(a)a.onclick=function(){state.p.costs.unshift(["Builder Harness","GPT","Development",1.25]);save();render()};
var sim=document.getElementById("simulate");if(sim)sim.onclick=function(){var m=state.p.metrics;m.visitors+=200;m.activation=+(m.activation+1.7).toFixed(1);m.trial=+(m.trial+.9).toFixed(1);m.paid=+(m.paid+.4).toFixed(1);m.mrr=+(m.mrr+state.p.price*8).toFixed(2);save();render();toast("200 sessions simulated")};
var reset=document.getElementById("reset");if(reset)reset.onclick=function(){localStorage.removeItem("startupOS.project");state.p=clone(DEFAULT);render();toast("Pilot reset")};
var create=document.getElementById("createVenture");if(create)create.onclick=function(){var idea=document.getElementById("newIdea").value.trim();if(!idea){toast("아이디어를 입력해주세요");return}state.p=clone(DEFAULT);state.p.name=idea.replace(/[^가-힣a-zA-Z0-9 ]/g," ").trim().split(/\s+/).slice(0,2).join(" ")||"New Venture";state.p.idea=idea;state.p.customer=document.getElementById("newCustomer").value||"초기 검증 고객";state.p.budget=Number(document.getElementById("newBudget").value||100);state.p.score=68;state.p.metrics={visitors:0,activation:0,trial:0,paid:0,mrr:0};state.p.costs=[["Venture CEO","Demo","Planning",0]];state.p.decisions=["새 Venture 생성: 사업 가설로 변환"];save();state.modal=false;state.view="venture";render()};
}
render();
})();
</script>
</body>
</html>
