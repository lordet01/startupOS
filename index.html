<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Startup OS Pilot</title>
<style>
:root{--bg:#08111f;--panel:#0f1d32;--panel2:#142642;--line:#263a57;--text:#f6f9ff;--muted:#91a4bf;--blue:#638cff;--green:#45d7aa;--amber:#ffbf63}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#183d70 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;background:#08111fee}.brand{font-size:20px;font-weight:900;margin:4px 8px 24px}.brand i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#78a0ff,#665dff);font-style:normal;margin-right:8px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left}.nav button.on,.nav button:hover{background:#142642;color:white}.small{font-size:12px;color:var(--muted)}.side .small{position:absolute;bottom:20px}.main{min-width:0}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 26px;position:sticky;top:0;background:#08111fdc;backdrop-filter:blur(14px);z-index:4}.content{max-width:1380px;margin:auto;padding:28px}.hero,.card{background:linear-gradient(180deg,#11223a,#0d192b);border:1px solid var(--line);border-radius:18px}.hero{padding:30px;background:linear-gradient(135deg,#17355d,#0d1b30)}h1{font-size:36px;letter-spacing:-1px;margin:7px 0 10px}h2{font-size:20px;margin:0 0 12px}.hero p{max-width:800px;color:#bdc9da;line-height:1.65}.eyebrow{color:#a9c0ec;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.btn{border:1px solid var(--line);background:#152844;color:white;padding:10px 14px;border-radius:10px;font-weight:750;font-size:13px}.btn.primary{border:0;background:linear-gradient(135deg,#628dff,#7166ff)}.row{display:flex;gap:9px;flex-wrap:wrap}.section{margin-top:22px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{padding:17px}.metric b{display:block;font-size:27px;margin:7px 0}.metric span{font-size:12px;color:var(--muted)}.green{color:var(--green)!important}.amber{color:var(--amber)!important}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid #2f5376;background:#112742;color:#cbe0ff}.tag.ok{border-color:#286e58;background:#0d2c24;color:#9aefd3}.list{display:grid}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #223551}.item:last-child{border-bottom:0}.item b{font-size:13px}.item div div{font-size:11px;color:var(--muted);margin-top:4px}.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.agent{border:1px solid var(--line);background:#0b1728;border-radius:13px;padding:13px}.agent b{font-size:13px}.agent p{font-size:11px;color:var(--muted);line-height:1.45}.stack{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:10px;background:#0b1728;padding:8px 10px;font-size:12px}.chip strong{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#1c385f;margin-right:6px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #2d4463;background:#081522;color:white;padding:10px 11px;border-radius:9px;outline:none}.field textarea{min-height:90px}.callout{border:1px solid #31557f;background:#102541;border-radius:12px;padding:13px;color:#c9d8ed;font-size:12px;line-height:1.55}.gate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.gate div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px}.gate .pass{border-color:#27674f;background:#0d291f}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:10px;border-bottom:1px solid #223551;text-align:left}.table th{color:var(--muted)}.right{text-align:right!important}.hide{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:white;color:#08111f;padding:11px 14px;border-radius:10px;font-weight:800;box-shadow:0 15px 50px #0008}.modalWrap{position:fixed;inset:0;background:#02070fc7;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(720px,100%);background:#0c192c;border:1px solid #315071;border-radius:18px;padding:20px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{border:1px solid var(--line);background:#0b1728;padding:12px;border-radius:11px}.kpi span{display:block;font-size:11px;color:var(--muted)}.kpi b{font-size:19px}
@media(max-width:900px){.shell{grid-template-columns:70px 1fr}.brand{font-size:0}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:18px}.g4,.agents{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.side{position:fixed;bottom:0;top:auto;width:100%;height:64px;border-right:0;border-top:1px solid var(--line);z-index:10;padding:8px}.brand,.side .small{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button:nth-child(n+6){display:none}.main{padding-bottom:68px}.top{padding:0 13px}.content{padding:15px}.g4,.agents,.form,.kpis{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:22px}h1{font-size:28px}.gate{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
(function(){
var TRAVEL_TEMPLATE={
  name:"TripTodo Travel Planner",
  idea:"나만의 여행계획 특화 ToDo List 플래너 개발",
  customer:"자유여행을 준비하며 일정·예약·준비물을 여러 앱과 메모로 흩어 관리하는 20~40대 여행자",
  problem:"여행 준비 할 일, 예약 정보, 날짜별 일정, 짐 목록이 분산되어 출발 전 누락과 일정 관리 스트레스가 생긴다.",
  model:"Freemium + 구독",
  price:2.99,
  budget:100,
  stage:"Validation",
  score:68,
  metrics:{visitors:0,activation:0,trial:0,paid:0,mrr:0},
  costs:[],
  decisions:["예시 템플릿 로드: 실제 GPT 분석 실행 전 초기 가설"],
  mvpFeatures:["여행 생성","날짜별 ToDo","준비물 체크리스트","예약 링크/메모"],
  techStack:[],
  risks:["여행 플래너 시장의 높은 경쟁","무료 대체재 대비 명확한 가치 필요"],
  launchGates:["여행 생성→체크 완료 흐름","모바일 UX","데이터 저장"],
  nextExperiment:"여행 준비 중인 사용자 10명에게 클릭 가능한 프로토타입을 보여주고 반복 사용 의향을 확인",
  summary:"여행 준비 업무를 일정과 체크리스트 중심으로 한곳에 묶는 경량 모바일 웹 플래너",
  agentNotes:{}
};
var DEFAULT=JSON.parse(JSON.stringify(TRAVEL_TEMPLATE));
var state={view:"overview",p:load(),running:false,modal:false,runtimeStatus:"unknown"};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{var p=JSON.parse(localStorage.getItem("startupOS.project"));if(!p||p.name==="PhotoStory")return clone(DEFAULT);return p}catch(e){return clone(DEFAULT)}}
function save(){localStorage.setItem("startupOS.project",JSON.stringify(state.p))}
function money(n){return "$"+Number(n).toFixed(n<10?2:0)}
function spend(){return state.p.costs.reduce(function(s,x){return s+x[3]},0)}
function fee(){return spend()*.05}
function runtimeUrl(){var saved=localStorage.getItem("startupOS.runtimeUrl");if(saved)return saved;if(window.STARTUP_OS_CONFIG&&window.STARTUP_OS_CONFIG.runtimeUrl)return window.STARTUP_OS_CONFIG.runtimeUrl;if(location.hostname.endsWith(".vercel.app")||location.hostname==="localhost")return "/api/runtime";return ""}
function stackServices(){var t=state.p.techStack;if(t&&t.length)return t.map(function(x){return typeof x==="string"?x:(x.service||x.area)});return ["OpenAI GPT","Firebase","Vercel","GitHub","Stripe","PostHog","Resend"]}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nav(){var a=[["overview","Overview"],["venture","Venture Lab"],["agents","Agents"],["cost","Cost Ledger"],["launch","Launch"],["growth","Growth"],["settings","Settings"]];return '<aside class="side"><div class="brand"><i>S</i>Startup OS</div><div class="nav">'+a.map(function(x){return '<button data-view="'+x[0]+'" class="'+(state.view===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div><div class="small">Pilot v0.1<br>GitHub Pages</div></aside>'}
function shell(body){var live=state.runtimeStatus==="live";var badge=state.running?"GPT running…":(live?"Live GPT Runtime":(runtimeUrl()?"Runtime ready":"Runtime not linked"));return '<div class="shell">'+nav()+'<main class="main"><header class="top"><div class="small">'+esc(state.p.name)+' · '+state.p.stage+'</div><div class="row"><span class="tag '+(live?"ok":"")+'">'+badge+'</span><button class="btn" id="newVenture">+ New venture</button></div></header><div class="content">'+body+'</div></main></div>'}
function metric(t,v,n,c){return '<div class="card metric"><span>'+t+'</span><b class="'+(c||"")+'">'+v+'</b><span>'+n+'</span></div>'}
function agents(){var notes=state.p.agentNotes||{};var a=[["CEO","ceo","Goal / priority / gate"],["Market","market","Customer / competition"],["Product","product","MVP / UX / conversion"],["Finance","finance","Cost / pricing / margin"],["Tech","tech","Architecture / APIs"],["Builder","tech","Implementation / deploy"],["Legal","legal","Privacy / IP / policy"],["Growth","growth","Acquisition / experiments"]];return '<div class="agents">'+a.map(function(x,i){var note=notes[x[1]]||x[2];return '<div class="agent"><div class="head"><b>'+x[0]+' Agent</b><span class="tag '+(state.runtimeStatus==="live"?"ok":"")+'">'+(state.running&&i<4?"Running":state.runtimeStatus==="live"?"Synced":"Ready")+'</span></div><p>'+esc(note)+'</p></div>'}).join("")+'</div>'}

function gates(){return '<div class="gate"><div class="pass">✓<br><b>Problem</b></div><div class="pass">✓<br><b>Customer</b></div><div class="pass">✓<br><b>MVP</b></div><div>!<br><b>Payment</b></div><div>!<br><b>Legal</b></div></div>'}
function overview(){var p=state.p,s=spend(),ready=Math.min(100,Math.round((p.score+18)/1.18));var summary=p.summary||"아직 실제 AI 분석을 실행하지 않았습니다.";return shell('<section class="hero"><div class="eyebrow">AI Venture Operating System</div><h1>아이디어가 아니라 <span style="color:#89a8ff">수익화되는 사업</span>을 만듭니다.</h1><p>'+esc(p.idea)+'</p><div class="row" style="margin-top:20px"><button class="btn primary" id="runCycle">'+(state.running?"GPT agents running…":"Run next venture cycle")+'</button><button class="btn" id="analyzeNow">Analyze with GPT</button><button class="btn" id="loadTravel">Load travel planner template</button></div></section><section class="section grid g4">'+metric("Venture Score",p.score+"/100","시장성 · 실행성 · 원가 · 위험",p.score>=70?"green":"amber")+metric("MVP Readiness",ready+"%","Launch gate 기준",ready>=80?"green":"")+metric("External Cost",money(s),"실제 API 사용 원가")+metric("Startup OS Fee",money(fee()),"외부 실비의 5%")+'</section><section class="section grid g2"><div class="card"><div class="head"><h2>Latest AI decision</h2><span class="tag '+(state.runtimeStatus==="live"?"ok":"")+'">'+(state.runtimeStatus==="live"?"OpenAI live":"Template")+'</span></div><div class="callout">'+esc(summary)+'</div><div class="list" style="margin-top:10px">'+item("Next experiment",p.nextExperiment||"GPT 분석 후 생성")+item("Target customer",p.customer)+item("Problem",p.problem)+item("Monetization",p.model+" · "+money(p.price))+'</div></div><div class="card"><h2>Recommended stack</h2><div class="stack">'+stackServices().map(function(x){return '<span class="chip"><strong>'+esc(x).charAt(0)+'</strong>'+esc(x)+'</span>'}).join("")+'</div><div class="callout" style="margin-top:14px">AI가 불필요한 기능은 일반 코드/DB로 처리하고, AI 호출은 실제 토큰 비용을 Ledger에 기록합니다.</div></div></section><section class="section"><div class="head"><div><h2>Agent board</h2><div class="small">한 번의 저비용 structured call로 CEO 위원회 판단을 만들고 역할별 결과를 분리합니다.</div></div><button class="btn" data-view="agents">Open agents</button></div>'+agents()+'</section><section class="section grid g2"><div class="card"><h2>MVP features</h2><div class="list">'+(p.mvpFeatures||[]).map(function(x){return item(x,"MVP scope")}).join("")+'</div></div><div class="card"><h2>Decision log</h2><div class="list">'+p.decisions.slice(0,8).map(function(x,i){return item((i+1)+". "+x,"Venture CEO decision")}).join("")+'</div></div></section>')}

function item(a,b){return '<div class="item"><div><b>'+esc(a)+'</b><div>'+esc(b)+'</div></div></div>'}
function venture(){var p=state.p;var tech=(p.techStack&&p.techStack.length)?p.techStack:[{area:"AI runtime",service:"OpenAI GPT API",reason:"실제 기획/판단 호출",monthly_cost_usd:1},{area:"Backend",service:"Firebase",reason:"Auth + Firestore",monthly_cost_usd:0},{area:"Hosting",service:"Vercel",reason:"Static + Serverless",monthly_cost_usd:0},{area:"Analytics",service:"PostHog",reason:"퍼널/실험",monthly_cost_usd:0}];return shell('<div class="head"><div><h2 style="font-size:27px">Venture Lab</h2><div class="small">문제·고객·수익모델을 먼저 고정하고 실제 GPT가 사업 설계를 갱신합니다.</div></div><div class="row"><button class="btn" id="saveThesis">Save thesis</button><button class="btn primary" id="analyzeNow">Analyze with GPT</button></div></div><div class="grid g2"><div class="card"><div class="form"><div class="field full"><label>Venture name</label><input id="name" value="'+esc(p.name)+'"></div><div class="field full"><label>Idea</label><textarea id="idea">'+esc(p.idea)+'</textarea></div><div class="field"><label>Target customer</label><input id="customer" value="'+esc(p.customer)+'"></div><div class="field"><label>Business model</label><input id="model" value="'+esc(p.model)+'"></div><div class="field full"><label>Problem</label><textarea id="problem">'+esc(p.problem)+'</textarea></div><div class="field"><label>Selling price (USD)</label><input id="price" type="number" step=".01" value="'+p.price+'"></div><div class="field"><label>MVP budget (USD)</label><input id="budget" type="number" value="'+p.budget+'"></div></div></div><div class="card"><div class="head"><h2>AI feasibility brief</h2><span class="tag '+(state.runtimeStatus==="live"?"ok":"")+'">'+(state.runtimeStatus==="live"?"LIVE":"template")+'</span></div><div class="callout">'+esc(p.summary||"Analyze with GPT를 실행하면 실제 사업화 판단이 들어옵니다.")+'</div><div class="list" style="margin-top:12px">'+item("Next experiment",p.nextExperiment||"미정")+item("MVP external build cost",money(p.estimatedMvpCost||0))+item("Monthly ops @ 1,000 MAU",money(p.estimatedOpsCost||0))+item("Top risk",(p.risks&&p.risks[0])||"GPT 분석 필요")+'</div></div></div><section class="section card"><h2>Technology budget architect</h2><table class="table"><tr><th>Capability</th><th>Choice</th><th>Reason</th><th class="right">Monthly est.</th></tr>'+tech.map(function(x){return '<tr><td>'+esc(x.area||"-")+'</td><td>'+esc(x.service||x)+'</td><td>'+esc(x.reason||"-")+'</td><td class="right">'+money(Number(x.monthly_cost_usd||0))+'</td></tr>'}).join("")+'</table></section>')}

function agentView(){return shell('<div class="head"><div><h2 style="font-size:27px">Agent Control Room</h2><div class="small">Evidence → Decision → Action · OpenAI structured runtime</div></div><button class="btn primary" id="runCycle">Run next cycle</button></div>'+agents()+'<section class="section grid g2"><div class="card"><h2>Scheduler policy</h2><div class="list">'+item("Goal","유료 사용 의향을 확인하고 최소비용 MVP 출시")+item("Current bottleneck",state.p.nextExperiment||"첫 GPT 분석 필요")+item("Budget cap",money(state.p.budget)+" MVP total")+item("Approval","배포·결제·광고비는 Human approval")+'</div></div><div class="card"><h2>Runtime</h2><div class="list">'+item("Provider","OpenAI Responses API")+item("Last model",(state.p.runtimeLast&&state.p.runtimeLast.model)||"not called")+item("Last tokens",(state.p.runtimeLast&&state.p.runtimeLast.tokens)||"0")+item("Last latency",(state.p.runtimeLast&&state.p.runtimeLast.latency)||"-")+'</div></div></section>')}

function costView(){var s=spend(),f=fee();return shell('<div class="head"><div><h2 style="font-size:27px">Cost Ledger</h2><div class="small">모든 외부 비용과 수수료를 투명하게 추적</div></div><button class="btn" id="addCost">+ Add test cost</button></div><div class="grid g4">'+metric("External spend",money(s),"3rd party cost")+metric("Platform fee",money(f),"5% pilot fee")+metric("Customer bill",money(s+f),"실비 + Startup OS")+metric("Budget left",money(Math.max(0,state.p.budget-s-f)),"MVP budget")+'</div><section class="section card"><table class="table"><tr><th>Agent</th><th>Provider</th><th>Type</th><th class="right">External cost</th></tr>'+state.p.costs.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td class="right">'+money(x[3])+'</td></tr>'}).join("")+'</table></section><section class="section grid g2"><div class="card"><h2>Billing formula</h2><div class="callout"><b>Customer bill = External cost + Startup OS fee</b><br><br>Pilot fee: 5%. 실제 상품화 시 최소 수수료 또는 월 기본료 추가 가능.</div></div><div class="card"><h2>Cost guardrails</h2><div class="list">'+item("Agent cycle","$10 hard cap")+item("AI feature","Gross margin 70%+")+item("MVP build",money(state.p.budget)+" max")+item("Unexpected spike","Pause & approval")+'</div></div></section>')}
function launch(){return shell('<div class="head"><div><h2 style="font-size:27px">Launch Center</h2><div class="small">사업·기술·법률·계측 조건 확인</div></div><button class="btn primary" data-toast="Launch checklist prepared">Prepare launch</button></div><div class="card">'+gates()+'</div><section class="section grid g2"><div class="card"><h2>Checklist</h2><div class="list">'+item("Product","핵심 happy path 완료")+item("Analytics","activation / paid event 정의")+item("Payments","Stripe sandbox 검증 필요")+item("Legal","Privacy / Terms 검토 필요")+item("Ops","오류/비용 alert 준비")+'</div></div><div class="card"><h2>Human approval</h2><div class="callout">Production 배포, 실제 결제 활성화, 광고비 집행, 법률 정책 변경은 자동 실행하지 않고 승인 요청을 생성합니다.</div></div></section>')}
function growth(){var m=state.p.metrics;return shell('<div class="head"><div><h2 style="font-size:27px">Growth Loop</h2><div class="small">출시 후 숫자로 다음 실험을 결정</div></div><button class="btn primary" id="simulate">Simulate +200 sessions</button></div><div class="kpis">'+[["Visitors",m.visitors],["Activation",m.activation+"%"],["Trial intent",m.trial+"%"],["Paid",m.paid+"%"],["MRR",money(m.mrr)]].map(function(x){return '<div class="kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("")+'</div><section class="section grid g2"><div class="card"><h2>Current bottleneck</h2><div style="font-size:28px;font-weight:900;color:var(--amber);margin:15px 0">Activation → Paid</div><p class="small" style="line-height:1.7">광고 확장보다 사용자가 첫 가치를 경험하고 결제로 이동하는 구간을 먼저 고칩니다.</p></div><div class="card"><h2>Next experiment</h2><div class="list">'+item("Hypothesis","결제 전 미리보기 → paid intent 상승")+item("Variant B","30초 미리보기 + 즉시 가격")+item("Sample","200 qualified sessions")+item("Success gate","Paid intent ≥ 5%")+'</div></div></section>')}
function settings(){var ru=runtimeUrl();return shell('<div class="grid g2"><div class="card"><div class="head"><h2>AI runtime</h2><span class="tag '+(state.runtimeStatus==="live"?"ok":"")+'">'+(state.runtimeStatus==="live"?"LIVE":"not verified")+'</span></div><div class="field"><label>Runtime endpoint</label><input id="runtimeEndpoint" placeholder="https://your-project.vercel.app/api/runtime" value="'+esc(ru)+'"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="saveRuntime">Save endpoint</button><button class="btn" id="testRuntime">Test runtime</button></div><div class="callout" style="margin-top:12px">GitHub Pages는 정적 호스팅이므로 OpenAI secret은 Vercel Serverless에 보관합니다. Vercel에서 앱 전체를 열면 같은 origin의 /api/runtime을 자동 사용합니다.</div></div><div class="card"><h2>Local data</h2><p class="small">Venture State와 runtime endpoint는 현재 브라우저 localStorage에 저장됩니다. OpenAI API key는 브라우저에 저장하지 않습니다.</p><button class="btn" id="reset">Reset pilot data</button></div></div>')}

function modal(){return '<div class="modalWrap"><div class="modal"><div class="head"><div><div class="eyebrow">New venture</div><h2>무엇을 만들고 싶나요?</h2></div><button class="btn" id="closeModal">×</button></div><div class="callout" style="margin-bottom:12px"><b>Template</b><br>“나만의 여행계획 특화 ToDo List 플래너 개발”을 예시 프로젝트로 바로 불러올 수 있습니다.<div style="margin-top:10px"><button class="btn" id="loadTravel">Use travel planner template</button></div></div><div class="form"><div class="field full"><label>아이디어</label><textarea id="newIdea" placeholder="예: 영수증을 찍으면 자동으로 지출을 분류해주는 서비스"></textarea></div><div class="field"><label>누가 쓰나요?</label><input id="newCustomer"></div><div class="field"><label>최대 MVP 예산 (USD)</label><input id="newBudget" type="number" value="100"></div></div><div class="callout" style="margin-top:12px">Analyze venture를 누르면 실제 runtime endpoint가 연결된 경우 GPT가 문제정의 · MVP · 수익모델 · 기술스택 · 비용 · 위험 · 첫 실험을 생성합니다.</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="createVenture">Analyze venture</button></div></div></div>'}

function render(){var map={overview:overview,venture:venture,agents:agentView,cost:costView,launch:launch,growth:growth,settings:settings};document.getElementById("app").innerHTML=(map[state.view]||overview)()+(state.modal?modal():"");bind()}
function toast(msg){var d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
async function callRuntime(mode){var url=runtimeUrl();if(!url)throw new Error("Runtime endpoint가 없습니다. Settings에서 Vercel runtime URL을 연결하세요.");var resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:mode,project:state.p})});var data=await resp.json().catch(function(){return {error:"Invalid runtime response"}});if(!resp.ok||!data.ok)throw new Error(data.error||("Runtime HTTP "+resp.status));return data}
function applyAnalysis(data){var a=data.analysis||{};if(a.venture_name)state.p.name=a.venture_name;if(a.target_customer)state.p.customer=a.target_customer;if(a.problem)state.p.problem=a.problem;if(a.monetization)state.p.model=a.monetization;if(Number.isFinite(a.recommended_price_usd))state.p.price=a.recommended_price_usd;if(Number.isFinite(a.venture_score))state.p.score=a.venture_score;state.p.summary=a.executive_summary||state.p.summary;state.p.mvpFeatures=a.mvp_features||state.p.mvpFeatures;state.p.techStack=a.tech_stack||state.p.techStack;state.p.risks=a.risks||state.p.risks;state.p.launchGates=a.launch_gates||state.p.launchGates;state.p.nextExperiment=a.next_experiment||state.p.nextExperiment;state.p.agentNotes=a.agent_notes||state.p.agentNotes;state.p.estimatedMvpCost=a.estimated_mvp_external_cost_usd;state.p.estimatedOpsCost=a.estimated_monthly_ops_usd_at_1000_mau;if(a.next_action)state.p.decisions.unshift(a.next_action);if(a.next_experiment)state.p.decisions.unshift("실험: "+a.next_experiment);var provider=Number(data.cost&&data.cost.provider_usd||0);state.p.costs.unshift(["Startup OS Runtime","OpenAI / "+(data.model||"GPT"),data.mode||"analyze",provider]);state.p.runtimeLast={model:data.model||"GPT",tokens:String((data.usage&&data.usage.input_tokens||0)+(data.usage&&data.usage.output_tokens||0)),latency:String(data.latency_ms||0)+" ms",responseId:data.response_id||""};state.runtimeStatus="live";save()}
async function run(mode){if(state.running)return;state.running=true;render();try{var data=await callRuntime(mode||"cycle");applyAnalysis(data);toast("GPT venture decision complete · "+money(data.cost.provider_usd)+" API cost")}catch(e){state.runtimeStatus="error";toast(e.message)}finally{state.running=false;render()}}
function captureThesis(){["name","idea","customer","problem","model","price","budget"].forEach(function(k){var el=document.getElementById(k);if(!el)return;state.p[k]=(k==="price"||k==="budget")?Number(el.value):el.value});save()}
async function testRuntime(){var url=runtimeUrl();if(!url){toast("Runtime endpoint를 먼저 저장하세요");return}try{var r=await fetch(url);var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Runtime unavailable");state.runtimeStatus="live";render();toast("Runtime live · "+d.model)}catch(e){state.runtimeStatus="error";render();toast("Runtime test failed: "+e.message)}}
function loadTravelTemplate(){state.p=clone(TRAVEL_TEMPLATE);save();state.modal=false;state.view="venture";render();toast("Travel planner template loaded")}

function bind(){
document.querySelectorAll("[data-view]").forEach(function(b){b.onclick=function(){state.view=b.dataset.view;render()}});
var n=document.getElementById("newVenture");if(n)n.onclick=function(){state.modal=true;render()};
var cbtn=document.getElementById("closeModal");if(cbtn)cbtn.onclick=function(){state.modal=false;render()};
document.querySelectorAll("#runCycle").forEach(function(r){r.onclick=function(){run("cycle")}});
document.querySelectorAll("#analyzeNow").forEach(function(r){r.onclick=function(){captureThesis();run("analyze")}});
document.querySelectorAll("#loadTravel").forEach(function(r){r.onclick=loadTravelTemplate});
document.querySelectorAll("[data-toast]").forEach(function(b){b.onclick=function(){toast(b.dataset.toast)}});
var s=document.getElementById("saveThesis");if(s)s.onclick=function(){captureThesis();toast("Venture thesis saved")};
var a=document.getElementById("addCost");if(a)a.onclick=function(){state.p.costs.unshift(["Manual test","External API","Test",1.25]);save();render()};
var sim=document.getElementById("simulate");if(sim)sim.onclick=function(){var m=state.p.metrics;m.visitors+=200;m.activation=+(m.activation+1.7).toFixed(1);m.trial=+(m.trial+.9).toFixed(1);m.paid=+(m.paid+.4).toFixed(1);m.mrr=+(m.mrr+state.p.price*8).toFixed(2);save();render();toast("200 sessions simulated")};
var reset=document.getElementById("reset");if(reset)reset.onclick=function(){localStorage.removeItem("startupOS.project");state.p=clone(DEFAULT);render();toast("Pilot reset")};
var saveRt=document.getElementById("saveRuntime");if(saveRt)saveRt.onclick=function(){var v=document.getElementById("runtimeEndpoint").value.trim();if(v&&v.endsWith("/"))v=v.slice(0,-1);localStorage.setItem("startupOS.runtimeUrl",v);state.runtimeStatus="unknown";render();toast("Runtime endpoint saved")};
var testRt=document.getElementById("testRuntime");if(testRt)testRt.onclick=testRuntime;
var create=document.getElementById("createVenture");if(create)create.onclick=function(){var idea=document.getElementById("newIdea").value.trim();if(!idea){toast("아이디어를 입력해주세요");return}state.p=clone(TRAVEL_TEMPLATE);state.p.name=idea.replace(/[^가-힣a-zA-Z0-9 ]/g," ").trim().split(/\s+/).slice(0,3).join(" ")||"New Venture";state.p.idea=idea;state.p.customer=document.getElementById("newCustomer").value||"초기 검증 고객";state.p.budget=Number(document.getElementById("newBudget").value||100);state.p.score=60;state.p.metrics={visitors:0,activation:0,trial:0,paid:0,mrr:0};state.p.costs=[];state.p.decisions=["새 Venture 생성: GPT 분석 대기"];state.p.summary="";state.p.techStack=[];state.p.agentNotes={};save();state.modal=false;state.view="venture";render();run("analyze")};
}
render();
})();
</script>
</body>
</html>
