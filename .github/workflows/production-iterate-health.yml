name: Production Iterate UI health
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-iterate-health.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iterate-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect live startup-os UI, chat API, Build runtime and local screenshot vendor
        shell: bash
        run: |
          set -euo pipefail
          HOST="https://startup-os-beige.vercel.app"
          for attempt in 1 2 3 4 5 6; do
            echo "Health attempt: $attempt"
            build_status=$(curl -LsS --max-time 20 -o /tmp/build.json -w "%{http_code}" "$HOST/api/build" || true)
            refine_status=$(curl -LsS --max-time 20 -o /tmp/refine.json -w "%{http_code}" "$HOST/api/refine" || true)
            ui_status=$(curl -LsS --max-time 20 -o /tmp/studio.html -w "%{http_code}" "$HOST/builder/" || true)
            js_status=$(curl -LsS --max-time 20 -o /tmp/refine.js -w "%{http_code}" "$HOST/builder/refinement.js" || true)
            vendor_status=$(curl -LsS --max-time 20 -o /tmp/vendor.js -w "%{http_code}" "$HOST/vendor/html2canvas.min.js" || true)
            echo "GET /api/build $build_status; /api/refine $refine_status; /builder/ $ui_status; /builder/refinement.js $js_status; /vendor/html2canvas.min.js $vendor_status"
            if [[ "$build_status" == 200 && "$refine_status" == 200 && "$ui_status" == 200 && "$js_status" == 200 && "$vendor_status" == 200 ]] && node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const b=JSON.parse(fs.readFileSync('/tmp/build.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/refine.json','utf8'));
          const html=fs.readFileSync('/tmp/studio.html','utf8');
          const code=fs.readFileSync('/tmp/refine.js','utf8');
          const vendor=fs.readFileSync('/tmp/vendor.js','utf8');
          assert.equal(b.ok,true);assert.equal(b.version,'functional-build-3.3.0');
          assert.ok(b.contracts.skin);
          assert.equal(r.ok,true);assert.equal(r.feature,'session_refinement');assert.equal(r.screenshot,true);assert.ok(r.supported.includes('skin'));
          assert.ok(html.includes('builder/refinement.js'));
          assert.ok(code.includes('refineCapture')&&code.includes('refineApprove')&&code.includes('pointerdown'));
          assert.ok(code.includes('id="refineCrop"')&&code.includes('refineCropOverlay')&&code.includes('startPartialCapture')&&code.includes('drawImage(sourceCanvas'));
          assert.ok(code.includes('scrollY:-win.scrollY')&&!code.includes('x:win.scrollX,y:win.scrollY'));
          assert.ok(vendor.includes('html2canvas'));
          console.log('LIVE PRODUCTION PASS: Build '+b.version+', full + partial crop, scroll-aware preview, annotated screenshot chat and vendor asset');
          JS
            then
              exit 0
            fi
            head -c 250 /tmp/refine.json || true
            sleep 8
          done
          echo "::error::Production Iterate endpoints or assets not ready"
          exit 1

      - name: Live coder generates an executable red-camera Build preview (no AI cost)
        shell: bash
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            const host='https://startup-os-beige.vercel.app';
            const health=await (await fetch(host+'/api/build')).json();
            const refine=await (await fetch(host+'/api/refine')).json();
            assert.equal(refine.codeEdits,true);
            assert.ok(refine.supported.includes('skin')&&refine.supported.includes('receipt')&&refine.supported.includes('travel'));
            const prior={version:health.version,sid:'vs_code_live_smoke',bid:'b_11111111-1111-4111-8111-111111111111',kind:'skin',name:'Smoke Skin',sourceHash:health.sourceHash,createdAt:new Date().toISOString()};
            const search='id="capture">📷 카메라</button>';
            const replacement='id="capture"><svg class="camera-live-smoke" stroke="#e52b3c" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg> 카메라</button>';
            const request={action:'refine-and-assemble',approved:true,project:{_sessionId:prior.sid,name:prior.name},priorBuild:prior,codeEdits:[{file:'capabilities/skin.js',search,replace:replacement}]};
            const response=await fetch(host+'/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});
            const payload=await response.json();
            assert.equal(response.status,200,JSON.stringify(payload).slice(0,450));
            assert.equal(payload.ok,true);
            assert.equal(payload.build.parentBuildId,prior.bid);
            assert.equal(payload.build.codeEdits.length,1);
            assert.ok(payload.build.checks.some(x=>x.id==='generated_code_boot'&&x.status==='passed'));
            const preview=await fetch(host+payload.build.previewUrl);
            assert.equal(preview.status,200);
            const html=await preview.text();
            assert.ok(html.includes('camera-live-smoke'));
            assert.ok(html.includes('#e52b3c'));
            console.log('LIVE CODE BUILDER PASS:',payload.build.bid,'source',health.sourceHash,'preview HTML contains real red SVG camera icon');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
