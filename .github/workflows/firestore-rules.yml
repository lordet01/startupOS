name: Account data authorization
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore owner, revision and immutable history rules
        run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project demo-startupos "npm run test:rules"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-rules-evidence
          path: test-results/firestore-rules-report.json
