name: Production Build API health
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-build-health.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-build-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert StartupOS production build runtime is healthy
        shell: bash
        run: |
          set -euo pipefail
          URL="https://startup-os-beige.vercel.app/api/build"
          ok=false
          for attempt in 1 2 3 4 5 6; do
            echo "Production Build API health attempt $attempt"
            status=$(curl -L -sS --max-time 18 -o /tmp/build-health.json -w '%{http_code}' "$URL" || true)
            echo "HTTP $status"
            if [[ "$status" == "200" ]] && node -e '
              const fs=require("fs");
              const d=JSON.parse(fs.readFileSync("/tmp/build-health.json","utf8"));
              if(!d.ok||!d.sourceHash||!d.contracts?.skin||!d.repairRecipes?.some(x=>x.id==="vercel-function-assets-v1"))process.exit(1);
              console.log("Build API OK:",d.version,d.mode,d.sourceHash,"repairs",d.repairRecipes.length);
            '; then
              ok=true
              break
            fi
            head -c 500 /tmp/build-health.json || true
            echo
            sleep 10
          done
          if [[ "$ok" != true ]]; then
            echo "::error::Production Build API is not ready or returned ENOENT/non-JSON. Refusing to mark repair complete."
            exit 1
          fi
      - name: Exercise actual Repair Plan and Fix/New Build API
        run: |
          node <<'JS'
          const base='https://startup-os-beige.vercel.app/api/build';
          const sid='vs_repair_health01';
          const prior={sid,bid:'b_11111111-1111-4111-8111-111111111111',kind:'skin',name:'MySkin Repair Health',sourceHash:'0'.repeat(64),version:'functional-build-3.2.0'};
          const issue={kind:'skin',code:'RUNTIME_OR_UX_FAILURE',stage:'image_analysis',message:"ENOENT: no such file or directory, open '/var/task/capabilities/data.js'",buildId:prior.bid,sourceHash:prior.sourceHash,source:'user_report'};
          async function request(payload){
            const r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            const d=await r.json();
            if(!r.ok||!d.ok)throw Error('POST /api/build HTTP '+r.status+' '+JSON.stringify(d).slice(0,500));
            return d;
          }
          (async()=>{
            const plan=await request({action:'repair-plan',priorBuild:prior,issue});
            if(plan.plan.repairId!=='vercel-function-assets-v1'||plan.plan.status!=='PATCH_AVAILABLE')throw Error('Unexpected repair mapping '+JSON.stringify(plan.plan));
            const build=await request({action:'repair-and-assemble',approved:true,project:{_sessionId:sid,name:'MySkin Repair Health'},priorBuild:prior,issue,kind:'skin',acceptedScope:true});
            if(build.build.status!=='IMPLEMENTED'||build.build.repairId!=='vercel-function-assets-v1'||!build.build.artifactHash)throw Error('Invalid repaired artifact');
            console.log('LIVE REPAIR PASSED:',plan.plan.repairId,'→',build.build.bid,'checks',build.build.checks.length);
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
