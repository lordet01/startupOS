<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StartupOS · Build</title>
<link rel="stylesheet" href="/capabilities/app.css">
<style>
:root{--bg:#ffffff;--ink:#17375e;--muted:#5e738d;--line:#dce5ef;--card:#ffffff;--accent:#5e738d;--accent2:#dce5ef;--danger:#b43650;background:var(--bg);color:var(--ink)}
body{background:#ffffff;color:var(--ink)}
.studio{max-width:1180px;margin:auto;padding:22px 24px 80px}
.studio-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.studio-head select{max-width:420px;background:#ffffff;color:#17375e;border:1px solid #dce5ef}
.toplink{color:#17375e;text-decoration:none;font-weight:850}
.pageTitle{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:12px 0 18px}
.pageTitle h1{font-size:28px;margin:0;letter-spacing:-.04em}.pageTitle .muted{margin-top:5px}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 16px}
.stagebox{padding:12px 13px;border:1px solid #dce5ef;border-radius:13px;font-size:11px;background:#ffffff;color:#5e738d}
.stagebox strong{display:block;margin-bottom:4px;color:#17375e;font-size:12px}
.stagebox.pass{background:#dce5ef;border-color:#5e738d;color:#5e738d}.stagebox.pass strong{color:#17375e}
.card{background:#ffffff!important;border:1px solid #dce5ef!important;color:#17375e;box-shadow:none!important}
.scope{background:#ffffff!important;border:1px solid #dce5ef!important}
h2{font-size:17px;margin-bottom:10px}h3{font-size:13px;color:#17375e}
.muted,.hint,.tiny{color:#5e738d!important}
.field span,.field>label{color:#5e738d}
input:not([type=checkbox]),textarea,select{background:#ffffff;color:#17375e;border:1px solid #dce5ef}
input:focus,textarea:focus,select:focus{border-color:#5e738d;box-shadow:0 0 0 3px #5e738d20}
.btn{background:#dce5ef;color:#17375e;border:1px solid #dce5ef}.btn:hover{border-color:#5e738d}
.btn.primary{background:linear-gradient(135deg,#5e738d,#5e738d);border-color:transparent;color:white}
.btn.danger{color:#b43650;border-color:#dce5ef;background:#fff1f3}
.badge{background:#ffffff;color:#17375e;border:1px solid #dce5ef}
.notice{background:#dce5ef;color:#17375e;border:1px solid #dce5ef}
.notice.warn{background:#fff8e9;color:#8b5b13;border-color:#fff8e9}.notice.error,.errorbox{background:#fff1f3;color:#b43650;border:1px solid #dce5ef}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scopeList{display:grid;gap:6px}.scopeItem{font-size:12px;color:#5e738d;padding:7px 0;border-bottom:1px solid #dce5ef}.scopeItem:last-child{border-bottom:0}
.checkrow{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #dce5ef;font-size:12px}.checkrow .tiny{word-break:break-word}
.preview-frame{width:100%;height:700px;border:1px solid #dce5ef;border-radius:16px;background:#17375e}
.trace{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#ffffff;color:#17375e;padding:14px;border-radius:12px;max-height:300px;overflow:auto}
.state-label{font-size:12px;font-weight:800;color:#5e738d}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.studio .card{margin:12px 0}
.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.sectionHead h2{margin:0}
.metaRow{display:flex;gap:7px;flex-wrap:wrap}.metaChip{font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid #dce5ef;color:#5e738d}
.compactGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.busyline{background:#ffffff}.busyline:after{background:#5e738d}
details{margin:8px 0}summary{cursor:pointer;font-size:12px;font-weight:750;color:#17375e}
@media(max-width:760px){
  .studio{padding:14px 12px 88px;max-width:100%;overflow-x:hidden}
  .studio-head{position:sticky;top:0;z-index:30;margin:-14px -12px 14px;padding:10px 12px;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid #dce5ef;align-items:center;flex-direction:row}
  .studio-head .toplink{font-size:0;min-width:42px}.studio-head .toplink:before{content:"‹";font-size:28px;line-height:1}
  .studio-head select{max-width:none;min-width:0;flex:1;height:44px;font-size:13px}
  .pageTitle{margin:10px 0 12px;align-items:flex-start;flex-direction:column;gap:8px}.pageTitle h1{font-size:23px}.pageTitle .metaRow{max-width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .stages{display:flex;grid-template-columns:none;overflow-x:auto;gap:8px;margin:0 -12px 14px;padding:0 12px 5px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}.stages::-webkit-scrollbar{display:none}
  .stagebox{min-width:126px;display:flex;align-items:center;gap:9px;padding:10px 11px;scroll-snap-align:start}.stageIcon{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#ffffff;font-size:15px;flex:0 0 28px}.stagebox.pass .stageIcon{background:#dce5ef}.stagebox strong{margin:0;font-size:11px}.stageState{display:block;font-size:9px;margin-top:2px;color:#5e738d}.stagebox.pass .stageState{color:#5e738d}
  .two,.compactGrid{grid-template-columns:1fr}.scopeList{gap:2px}.scopeItem{font-size:11px;padding:6px 0}
  .studio .card{padding:14px;margin:10px 0;border-radius:14px}.sectionHead h2{font-size:15px}.badge{font-size:9px;padding:4px 7px}
  .btn{min-height:46px;padding:11px 13px}.workBtn{width:100%;min-width:0}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar .btn,.toolbar a.btn{width:100%}
  .field textarea{min-height:100px}.preview-frame{height:68vh;border-radius:12px}
  details.card{padding:13px}
}
@media(max-width:420px){
  .toolbar{grid-template-columns:1fr}.stagebox{min-width:116px}.metaChip{font-size:9px}.studio-head select{font-size:12px}
}

.workBtn{position:relative;overflow:hidden;min-width:132px}
.workBtn .workLabel{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px}
.workBtn.running{background:#dce5ef;border-color:#5e738d;color:#17375e;cursor:progress}
.workBtn.running:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:36%;background:linear-gradient(90deg,#5e738d,#5e738d,#5e738d);animation:btnrun 1.15s ease-in-out infinite}
.workBtn.failed{background:#fff1f3;border-color:#dce5ef;color:#b43650}
.workBtn .tinySpinner{width:10px;height:10px;border-radius:50%;border:2px solid #5e738d;border-top-color:#17375e;animation:spinBtn .8s linear infinite}
@keyframes btnrun{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
@keyframes spinBtn{to{transform:rotate(360deg)}}

.repairCard{border-color:#dce5ef!important;background:#ffffff!important}
.repairCard .notice.error{padding:12px}
.repairCard .repairCompare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.repairCompare>div{background:#ffffff;border:1px solid #dce5ef;border-radius:12px;padding:12px;min-width:0}
.repairCompare>div:last-child{border-color:#dce5ef;background:#ffffff}
.repairCompare h3{font-size:12px;color:#17375e;margin:0 0 7px}
.repairCompare p{font-size:12px;line-height:1.55;color:#17375e;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.repairTimeline{display:grid;gap:2px;margin:10px 0}
.repairTimeline .checkrow{margin:0;grid-template-columns:20px 1fr}
.repairTimeline .checkrow strong{font-size:12px;color:#17375e}
.repairTimeline .checkrow .tiny{font-size:11px;line-height:1.5}
#fixBuild{min-width:210px}
@media(max-width:760px){
 .repairCard .repairCompare{grid-template-columns:1fr}
 #fixBuild{width:100%}
 .repairCompare>div{padding:11px}
 .repairTimeline .checkrow .tiny{font-size:10px}
}
</style>
</head><body>
<main id="studio" class="studio"><p class="muted">Loading…</p></main>

</body></html>
