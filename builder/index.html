<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StartupOS · Functional Build</title><link rel="stylesheet" href="/capabilities/app.css"><style>.studio{max-width:1120px;margin:auto;padding:24px 18px 80px}.studio-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0 26px}.studio-head select{max-width:400px}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stagebox{padding:13px;border:1px solid var(--line);border-radius:14px;font-size:12px;background:white}.stagebox strong{display:block;margin-bottom:6px}.stagebox.pass{background:var(--accent2);border-color:#9ec8bc}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checkrow{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.checkrow .tiny{word-break:break-word}.preview-frame{width:100%;height:720px;border:1px solid var(--line);border-radius:18px;background:#fff}.trace{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;background:#102137;color:#e6edf5;padding:16px;border-radius:14px;max-height:350px;overflow:auto}.scope{background:#fff8e8;border:1px solid #ebd9b1}.toplink{text-decoration:none;font-weight:850}.state-label{font-size:12px;font-weight:800;color:var(--accent);overflow-wrap:anywhere}details{margin:10px 0}summary{cursor:pointer;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.studio .card{margin:16px 0}.stagebox.pending{color:var(--muted)}.button-note{max-width:480px}@media(max-width:760px){.two{grid-template-columns:1fr}.stages{grid-template-columns:1fr 1fr}.studio-head{align-items:flex-start;flex-direction:column}.preview-frame{height:650px}}
